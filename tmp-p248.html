(function(){
const lTimeoutField = document.getElementById( "apex_login_throttle_sec" ),
      lThrottleDiv = document.getElementById("apex_login_throttle_div"),
      lAriaTimeout = 10;
let lTimeout      = lTimeoutField ? +lTimeoutField.innerText : 0,
    lParentAlert = lTimeoutField ? lTimeoutField.closest( "[role='alert']" ) : null,
    lInitialTimeout = lTimeout;
if (lTimeout) {
    const lTimer = window.setInterval (
        function() {
            if ( lTimeout > 0 ) {
                if ( lInitialTimeout > lTimeout ) {
                    if ( lParentAlert ) {
                        lParentAlert.removeAttribute( "role" );
                        lParentAlert = null;
                    }
                    lTimeoutField.innerText = lTimeout;
                    if ( ( lInitialTimeout - lTimeout ) > lAriaTimeout / 2
                        && lTimeout >= lAriaTimeout
                        && lTimeout % lAriaTimeout === 0 )
                    {
                        if ( lThrottleDiv ) {
                            apex.message.ariaAlertMessage( lThrottleDiv.innerText );
                        }
                    }
                }
                lTimeout--;
            } else {
                window.clearInterval(lTimer);
                if ( lThrottleDiv ) {
                    lThrottleDiv.parentNode.removeChild( lThrottleDiv );
                    if ( lInitialTimeout >= lAriaTimeout ) {
                        apex.message.ariaAlertMessage( apex.lang.getMessage( "APEX.AUTHENTICATION.SIGN_IN_AGAIN" ) );
                    }
                    return true;
                }
            }
        },
